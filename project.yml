name: LunakPlayer

options:
  bundleIdPrefix: com.lunak
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  LunakPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: LunakPlayer
        excludes:
          - "Info.plist"

    settings:
      base:
        INFOPLIST_FILE: "LunakPlayer/Info.plist"
        PRODUCT_NAME: "LunakPlayer"
        PRODUCT_BUNDLE_IDENTIFIER: "com.lunak.player"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_STYLE: "Manual"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

schemes:
  LunakPlayer:
    build:
      targets:
        LunakPlayer: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
